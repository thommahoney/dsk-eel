# Runs the same checks as `dev/run check` and `dev/run smoke` do on a
# developer's machine, in the same container image, for every pull request
# and for every push to main. A push to main, which is what merging a pull
# request is, also publishes the binary it builds as a release. Merges made
# within a few minutes of each other can share one release: see the release
# job.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces the run for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection on main requires status checks by job name: this one,
  # "check (macos)", "check (windows)" and "release build" below. Renaming
  # one of those jobs means updating that rule as well.
  check:
    name: check
    # arm64, like the machine at the dome and the dev container on an Apple
    # silicon Mac.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # dev/run builds the image from dev/Dockerfile the first time it is
      # used. Doing it in a step of its own keeps the build log apart from
      # the results.
      - name: Build the dev image
        run: dev/run true

      - name: dev/run check
        run: dev/run check

      - name: dev/run smoke
        run: dev/run smoke

  # The same code on macOS, for developing on a Mac: built and tested with
  # the Go release go.mod names, once with the C compiler (which gives the
  # joystick) and once without (keyboard only). It also builds the macOS
  # release binary, so a pull request that breaks that build shows it.
  # This job is required for merging. It does not hold up the release for
  # the dome, which only waits for the Linux check.
  check-macos:
    name: check (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build, vet and test
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - name: Build and test without a C compiler
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: Build the release binary
        run: sh dev/release "$(TZ=UTC git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)-$(git rev-parse --short HEAD)"

  # The same code on Windows: built and tested with the Go release go.mod
  # names. The runner has a C compiler, so the first step includes the
  # joystick library and the race detector; the second is the build without
  # one, which is the kind the Windows release binary is. This job is
  # required for merging, and like the macOS one it does not hold up the
  # release for the dome.
  check-windows:
    name: check (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build, vet and test
        run: |
          gcc --version | head -1
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - name: Build and test without a C compiler
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: Build the release binary
        env:
          CGO_ENABLED: "0"
        run: sh dev/release "$(TZ=UTC git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)-$(git rev-parse --short HEAD)"

  # The binary a release carries is built with dev/run release for every
  # run, so a pull request that breaks that build cannot be merged: this
  # job is required, like check. It is the pull request's half: it builds
  # and publishes nothing, with a token that can only read.
  release-build:
    name: release build
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the build
        run: echo "BUILD=$(TZ=UTC git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)-$(git rev-parse --short HEAD)" >>"$GITHUB_ENV"

      - name: Build the release binary
        run: dev/run release "$BUILD"

      # Built here, from Linux and without the C compiler: a Windows binary
      # that plays from the keyboard and needs nothing installed to run.
      - name: Build the Windows release binary
        run: dev/run env GOOS=windows GOARCH=amd64 CGO_ENABLED=0 sh dev/release "$BUILD"

  # A push to main, which is what merging a pull request is, builds the same
  # binary from what is now on main and publishes it as a release, once the
  # checks on that commit have passed.
  #
  # Two jobs have a token that can write to the repository: this one and
  # release (macos) below. Of their run steps, only the last is given it.
  # The actions get it without being asked, as an input that defaults to the
  # job's token: actions/checkout in both jobs, which is told not to leave
  # it in the checkout (persist-credentials: false), and actions/setup-go in
  # release (macos). Both actions are pinned to a commit.
  release:
    name: release
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write # to create the release and its tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A build is named after the day its commit was made (in UTC) and
      # the commit, for example 2026-11-22-a77b7e7. That is the name of the
      # release and its tag, and what `dsk-eel --version` prints.
      - name: Name the build
        run: echo "BUILD=$(TZ=UTC git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)-$(git rev-parse --short HEAD)" >>"$GITHUB_ENV"

      - name: Build the release binary
        run: dev/run release "$BUILD"

      # Built here, from Linux and without the C compiler: a Windows binary
      # that plays from the keyboard and needs nothing installed to run.
      - name: Build the Windows release binary
        run: dev/run env GOOS=windows GOARCH=amd64 CGO_ENABLED=0 sh dev/release "$BUILD"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Publish only what main is at right now. If another merge has
          # landed since this run started, or this is an old run started
          # again, the run for the newer commit publishes that one, and an
          # older build must not take its place as the latest.
          tip=$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF_NAME is now at $tip. This run was for $GITHUB_SHA and publishes nothing."
            exit 0
          fi

          # A published build is never replaced. A draft is what a run that
          # was cut short leaves behind, and is made again.
          if draft=$(gh release view "$BUILD" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::notice::$BUILD is already published and is left as it is."
              exit 0
            fi
            gh release delete "$BUILD" --yes
          fi

          gh release create "$BUILD" \
            dist/dsk-eel-linux-arm64 dist/dsk-eel-linux-arm64.sha256 \
            dist/dsk-eel-windows-amd64.exe dist/dsk-eel-windows-amd64.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "$BUILD" \
            --generate-notes \
            --latest

  # Adds the macOS binary to the release the job above has just published.
  # It is built on a Mac, because the joystick library is C code that cannot
  # be built for macOS from Linux, with the Go release go.mod names and the
  # module versions go.sum pins. If the upload fails part of the way, running
  # this job again finishes it.
  release-macos:
    name: release (macos)
    if: github.event_name == 'push'
    needs: [check-macos, release]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write # to add files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Name the build
        run: echo "BUILD=$(TZ=UTC git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)-$(git rev-parse --short HEAD)" >>"$GITHUB_ENV"

      - name: Build the release binary
        run: sh dev/release "$BUILD"

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scratch=$(mktemp -d)

          # The release job publishes nothing when main has moved on, and
          # then there is nothing to add to. Only GitHub's own answer that
          # there is no such release (HTTP 404) is read that way. Any other
          # failure of the call fails the job, so that a network or API
          # error is not taken for a missing release.
          if ! gh api "repos/$GH_REPO/releases/tags/$BUILD" \
            --jq '.assets[] | "\(.name) \(.state) \(.digest)"' \
            >"$scratch/assets" 2>"$scratch/error"; then
            if grep -q '(HTTP 404)' "$scratch/error"; then
              echo "::notice::There is no release $BUILD, so the macOS binary is not published."
              exit 0
            fi
            cat "$scratch/error" >&2
            echo "::error::Could not read the release $BUILD, so nothing was uploaded. Run this job again."
            exit 1
          fi

          # Decide for both files, from that one reading of the release,
          # before changing anything. The files to upload are collected in
          # "$@".
          set --
          leftover=
          stop=
          for f in dsk-eel-darwin-arm64 dsk-eel-darwin-arm64.sha256; do
            state=$(awk -v name="$f" '$1 == name { print $2 }' "$scratch/assets")
            theirs=$(awk -v name="$f" '$1 == name { print $3 }' "$scratch/assets")
            case $state in
            "")
              set -- "$@" "dist/$f"
              ;;
            uploaded)
              # A published file is never replaced, and it has to be the
              # file built here: otherwise adding the other one would
              # publish a binary and a checksum that do not belong together.
              ours=sha256:$(shasum -a 256 <"dist/$f" | cut -d ' ' -f 1)
              case $theirs in
              "$ours") ;;
              sha256:*)
                echo "::error::$BUILD already has $f, and it is not the file this run built. The release has $theirs, this run built $ours."
                stop=1
                ;;
              *)
                # GitHub's API may give no SHA-256 for a file (it then says
                # null). The file may well be the one built here, but this
                # job cannot know, so it must not say that it differs.
                echo "::error::$BUILD already has $f, but GitHub reports no SHA-256 for it, so this job cannot tell whether it is the file this run built."
                stop=1
                ;;
              esac
              ;;
            starter | open)
              # Not a published file but what an upload that broke off can
              # leave behind. GitHub's API documentation says a failed
              # upload may leave an empty file in the state "starter", which
              # can be safely deleted; "open" is the only other state it
              # lists besides "uploaded".
              leftover="$leftover $f"
              set -- "$@" "dist/$f"
              ;;
            *)
              echo "::error::$BUILD has $f in a state this job does not know: $state."
              stop=1
              ;;
            esac
          done
          if [ -n "$stop" ]; then
            echo "::error::Nothing was uploaded or deleted: this job never replaces a published file. If the release should have this run's files instead, delete the ones named above from it by hand and run this job again."
            exit 1
          fi
          if [ $# -eq 0 ]; then
            echo "::notice::$BUILD already has the macOS binary and its checksum, the same as this run built."
            exit 0
          fi

          for f in $leftover; do
            gh release delete-asset "$BUILD" "$f" --yes
          done
          # Without --clobber, so that this can only ever add a file.
          gh release upload "$BUILD" "$@"
